[project]
name = "rachis"
authors = [
    { name = "Rachis Developers", email = "developers@qiime2.org" }
]
description = "None"
readme = {file = "README.md", content-type = "text/markdown"}
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python=">=3.10"
dependencies = [
    "bibtexparser>=1.4.3,<2.0.0",
    "dill>=0.4.0,<0.5.0",
    "flufl-lock>=9.0.0,<10.0.0",
    "networkx>=3.1,<4.0.0",
    "numpy>=1.26,<3.0.0",
    "pandas>=2.3,<3.1.0",
    "parsl>=2026.0",
    "platformdirs>=4.5.0",
    "psutil>=7.1.3,<8.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "setuptools>=80.9.0,<81.0.0",
    "tomlkit>=0.13.3,<0.14.0",
    "tzlocal>=5.3.1,<6.0.0",
    "lxml>=6.0.2,<7.0.0",
]

[project.urls]
Homepage = "https://qiime2.org"
Repository = "https://github.com/qiime2/qiime2"

[project.entry-points.'rachis.plugins']
"dummy-plugin" = "rachis.core.testing.plugin:dummy_plugin"
"other-plugin" = "rachis.core.testing.plugin:other_plugin"

[project.entry-points.'rachis.usage_drivers']
"python3" = "rachis.core.archive.provenance_lib:ReplayPythonUsage"

[dependency-groups]
dev = [
    "nox>=2025.11.12",
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.14.10",
]

[build-system]
requires = [
    "setuptools",
    "versioningit",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "src/rachis/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rachis = ["**/*"]

[tool.pytest]
addopts = ["--doctest-modules"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# equivalent for flake8
select = ["E", "F", "W"]
